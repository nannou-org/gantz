name: ci

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    permissions:
      id-token: "write"
      contents: "read"
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      RUSTDOCFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: develop -c cargo check --locked --all
            cache: check
          - command: develop -c cargo doc --all-features --locked --no-deps
            cache: doc
          - command: develop -c cargo fmt --all -- --check
          # No code is gated on a feature being off, so this also covers the
          # default features.
          - command: develop -c cargo test --all-features --locked --all
            cache: test
          # In an `--all` build, feature unification turns every crate's default
          # features back on. Each headless configuration needs its own run.
          - command: >-
              develop -c bash -c "
              cargo check --locked --all-targets --no-default-features -p gantz -p gantz_cli &&
              cargo check --locked --all-targets --no-default-features -p gantz_egui -p gantz_pattern -p gantz_plyphon &&
              cargo check --locked --all-targets --no-default-features -p gantz_ui &&
              cargo check --locked --all-targets --no-default-features --features datum -p gantz_ui"
            cache: features
          - command: fmt -- --ci
          - command: flake check --no-update-lock-file
          - command: build --print-build-logs --no-update-lock-file .#gantz-website
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: mitchmindtree-gantz
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # One cache per cargo job. With a shared key, the first job to finish
      # saves its target dir for all the others.
      - uses: Swatinem/rust-cache@v2
        if: matrix.cache
        with:
          key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: nix ${{ matrix.command }}

  upload-pr-preview-artifact:
    needs: nix
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: mitchmindtree-gantz
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build --print-build-logs .#gantz-website
      - name: Prepare artifact
        run: |
          cp -rL result artifact
          chmod -R u+w artifact
          echo "${{ github.event.pull_request.number }}" > artifact/PR_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: artifact/

  deploy-gantz-website:
    needs: nix
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: mitchmindtree-gantz
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build --print-build-logs .#gantz-website
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./result
          keep_files: true
