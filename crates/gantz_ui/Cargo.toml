[package]
name = "gantz_ui"
version = "0.5.1"
description = "Declarative UI tree model and value codecs for user-defined gantz GUIs."
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true

[features]
default = ["steel"]
steel = ["dep:steel-core", "dep:gantz_core"]
# Serde for the envelope model, for hosts and domains that store one.
serde = ["dep:serde"]

[dependencies]
gantz_ca.workspace = true
gantz_core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
steel-core = { workspace = true, optional = true }
thiserror.workspace = true
