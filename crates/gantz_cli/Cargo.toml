[package]
name = "gantz_cli"
version = "0.1.0"
description = "The gantz command line, as a library that apps built on gantz embed."
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
bevy_pkv = { workspace = true, optional = true }
clap.workspace = true
directories = { workspace = true, optional = true }
gantz_ca.workspace = true
gantz_collab = { workspace = true, optional = true }
gantz_collab_sync = { workspace = true, optional = true }
gantz_core.workspace = true
gantz_egui.workspace = true
gantz_format.workspace = true
gantz_io.workspace = true
gantz_store = { workspace = true, features = ["pkv"], optional = true }
serde = { workspace = true, optional = true }
steel-core.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
async-channel.workspace = true
gantz_base.workspace = true
gantz_ui.workspace = true
serde.workspace = true

[features]
default = ["collab"]
# The `join` subcommand, which mirrors a collaborative session to a directory,
# and the `vault` subcommand, which syncs a user's devices.
collab = [
    "dep:bevy_pkv",
    "dep:directories",
    "dep:gantz_collab",
    "dep:gantz_collab_sync",
    "dep:gantz_store",
    "dep:serde",
]
