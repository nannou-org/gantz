# Trunk config for the gantz website. pkgs/gantz-website.nix and local `trunk serve` from the
# `gantz-web` dev shell both use it. A post-build hook prepends a TextEncoder/TextDecoder
# polyfill to the wasm-bindgen glue. cpal loads that glue on the audio worklet thread, whose
# scope lacks them in Firefox.
[build]
target = "crates/gantz/web/index.html"
public_url = "./"
filehash = false
# The post-build hook below rewrites the wasm-bindgen glue after Trunk computes the
# subresource-integrity hashes. The baked-in `integrity` attributes would then mismatch and
# block loading, so SRI is disabled for this same-origin build.
no_sri = true

[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = ["crates/gantz/web/prepend-polyfill.sh"]

[serve]
port = 8088
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp" }
